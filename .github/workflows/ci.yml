name: CI

# Her PR ve main/develop push'unda kalite kapısı.
#
# CLAUDE.md: "Her fazın sonunda pnpm typecheck && lint && test && build →
# hepsi temiz." Bu iş akışı o kuralı insan disiplinine bırakmaz.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Aynı dala arka arkaya push gelirse eskisini iptal et — 2 vCPU'luk
# runner kotasını boşa harcama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kalite:
    name: Tip, lint, test ve derleme
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Entegrasyon testleri gerçek PostgreSQL + PostGIS ister. EİDS ve KVKK
    # güvenceleri yalnızca bu testlerle kanıtlanıyor; onları CI'da atlamak
    # kapıyı anlamsız kılardı.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: aslihangyd
          POSTGRES_PASSWORD: ci_gecici_sifre
          POSTGRES_DB: aslihangyd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aslihangyd -d aslihangyd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://aslihangyd:ci_gecici_sifre@localhost:5432/aslihangyd_test
      # CI'ya özel, tek kullanımlık sır. Üretim sırrıyla ilgisi yoktur.
      PAYLOAD_SECRET: ci_gecici_payload_sirri_degistirilmeyecek
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      # Next.js derleme önbelleği.
      #
      # `.next/cache` altında modül grafiği, SWC çıktısı ve görsel optimizasyon
      # sonuçları durur. Önbelleksiz her koşu bunları sıfırdan üretiyor ve
      # derleme süresinin büyük kısmı buraya gidiyor.
      #
      # Anahtar iki katmanlı: kilit dosyası + kaynak dosyaların özeti. Kaynak
      # değişince tam isabet olmaz ama `restore-keys` aynı bağımlılık
      # kümesindeki en son önbelleği geri yükler — Next.js değişmeyen modülleri
      # oradan alır. Bağımlılık değişirse önbellek bilinçli olarak ıskalanır;
      # eski SWC çıktısını yeni sürümle karıştırmak sinsi hatalar üretir.
      - name: Next.js derleme önbelleği
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', '*.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Veritabanı şemasını uygula
        run: pnpm payload migrate

      - name: Tip kontrolü
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testler (birim + entegrasyon)
        run: pnpm test

      # Derleme süresi ölçülüp iş akışı özetine yazılıyor.
      #
      # Eşik aşıldığında koşu BAŞARISIZ OLMAZ, yalnızca uyarı düşer. Derleme
      # süresi bir kalite kapısı değil, bir trend göstergesidir: yavaş bir
      # derleme kötü kod demek değildir, ama sessizce 5 dakikaya çıkması
      # fark edilmelidir. Testleri geçen bir PR'ı süre yüzünden bloklamak,
      # kapının kendisini anlamsızlaştırırdı.
      - name: Derleme
        id: derleme
        run: |
          baslangic=$(date +%s)
          pnpm build
          sure=$(( $(date +%s) - baslangic ))
          echo "sure=$sure" >> "$GITHUB_OUTPUT"
          echo "### Derleme süresi: ${sure} sn (eşik ${DERLEME_ESIGI_SN} sn)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$sure" -gt "$DERLEME_ESIGI_SN" ]; then
            echo "::warning title=Derleme süresi eşiği aşıldı::${sure} sn > ${DERLEME_ESIGI_SN} sn. docs/ILERLEME.md içindeki derleme süresi notunu güncelle."
          fi
        env:
          # Eşik 90 → 150 sn'ye çekildi (Faz 2B+). Gerekçe docs/ILERLEME.md.
          DERLEME_ESIGI_SN: '150'
