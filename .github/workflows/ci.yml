name: CI

# Her push ve her PR'da kalite kapısı — hedef dal ne olursa olsun.
#
# CLAUDE.md: "Her fazın sonunda pnpm typecheck && lint && test && build →
# hepsi temiz." Bu iş akışı o kuralı insan disiplinine bırakmaz.
#
# ─────────────────────────────────────────────────────────────────────────
# ⚠️ NEDEN FİLTRE YOK: ZİNCİRLEME PR'LARDA KAPI HİÇ KOŞMADI.
#
# Tetik `branches: [main, develop]` iken yalnızca main/develop'ı HEDEFLEYEN
# PR'lar sınanıyordu. 7 Ağustos 2026'daki on bir PR'lık yığında #10–#16
# birbirini hedefliyordu; yedisinde de tek bir kontrol koşmadı ve bu
# GitHub arayüzünde hata olarak değil, sessizce "kontrol yok" diye göründü.
#
# Yığının ucu (#19) yeşil olduğu için sonuç kurtuldu; ama bu tesadüftü.
# Ara dallardan biri bozuk olsaydı, bozukluk main'e ancak uçta — yani en
# geç ve en pahalı anda — görünecekti.
#
# İki tetik birlikte gerekiyor, biri diğerinin yerini tutmuyor:
#   · push       → dalın UCU doğrulanır (PR açılmamış olsa bile)
#   · pull_request → dalın main ile BİRLEŞMİŞ HALİ doğrulanır
# İkincisi olmadan `.gitignore` yutması gibi "yerelde geçer, depoda yok"
# hataları görünmez; birincisi olmadan PR açılana kadar hiçbir şey sınanmaz.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Aynı dala arka arkaya push gelirse eskisini iptal et — 2 vCPU'luk
# runner kotasını boşa harcama.
#
# ⚠️ Grup anahtarı PR numarasını da içeriyor: aynı commit hem push hem
# pull_request olayı üretir ve tek anahtar kullanılırsa bunlar birbirini
# iptal ederdi — kontrol "cancelled" görünür, kimse sebebini anlamazdı.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kalite:
    name: Tip, lint, test ve derleme
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Entegrasyon testleri gerçek PostgreSQL + PostGIS ister. EİDS ve KVKK
    # güvenceleri yalnızca bu testlerle kanıtlanıyor; onları CI'da atlamak
    # kapıyı anlamsız kılardı.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: aslihangyd
          POSTGRES_PASSWORD: ci_gecici_sifre
          POSTGRES_DB: aslihangyd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aslihangyd -d aslihangyd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://aslihangyd:ci_gecici_sifre@localhost:5432/aslihangyd_test
      # CI'ya özel, tek kullanımlık sır. Üretim sırrıyla ilgisi yoktur.
      PAYLOAD_SECRET: ci_gecici_payload_sirri_degistirilmeyecek
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      # Next.js derleme önbelleği.
      #
      # ⚠️ ÖLÇÜLDÜ: şu anda kazancı YOK denecek kadar az (37 sn → 35 sn,
      # gürültü seviyesinde). Sebep: Next 16 varsayılan olarak Turbopack
      # kullanıyor ve Turbopack derleme önbelleğini `.next/cache`'e YAZMIYOR.
      # Orada yalnızca 187 KB `.tsbuildinfo` kalıyor. Üstelik projedeki tüm
      # rotalar dinamik (ƒ), yani önbelleğe alınacak ön-render çıktısı da yok.
      #
      # Adım yine de duruyor: maliyeti ~1 sn, ve iki durumda kendiliğinden
      # işe yaramaya başlayacak — (a) bazı rotalar statikleşirse,
      # (b) Turbopack kalıcı önbelleği kararlı hale gelirse. Ayrıntılı ölçüm
      # docs/ILERLEME.md → "CI derleme önbelleği ölçümü".
      #
      # Anahtar iki katmanlı: kilit dosyası + kaynak özeti. Bağımlılık
      # değişirse önbellek bilinçli olarak ıskalanır; eski derleyici çıktısını
      # yeni sürümle karıştırmak sinsi hatalar üretir.
      - name: Next.js derleme önbelleği
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', '*.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Veritabanı şemasını uygula
        run: pnpm payload migrate

      - name: Tip kontrolü
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testler (birim + entegrasyon)
        run: pnpm test

      # Derleme süresi ölçülüp iş akışı özetine yazılıyor.
      #
      # Eşik aşıldığında koşu BAŞARISIZ OLMAZ, yalnızca uyarı düşer. Derleme
      # süresi bir kalite kapısı değil, bir trend göstergesidir: yavaş bir
      # derleme kötü kod demek değildir, ama sessizce 5 dakikaya çıkması
      # fark edilmelidir. Testleri geçen bir PR'ı süre yüzünden bloklamak,
      # kapının kendisini anlamsızlaştırırdı.
      - name: Derleme
        id: derleme
        run: |
          baslangic=$(date +%s)
          pnpm build
          sure=$(( $(date +%s) - baslangic ))
          echo "sure=$sure" >> "$GITHUB_OUTPUT"
          echo "### Derleme süresi: ${sure} sn (eşik ${DERLEME_ESIGI_SN} sn)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$sure" -gt "$DERLEME_ESIGI_SN" ]; then
            echo "::warning title=Derleme süresi eşiği aşıldı::${sure} sn > ${DERLEME_ESIGI_SN} sn. docs/ILERLEME.md içindeki derleme süresi notunu güncelle."
          fi
        env:
          # Eşik 90 → 150 sn'ye çekildi (Faz 2B+). Gerekçe docs/ILERLEME.md.
          DERLEME_ESIGI_SN: '150'

      # İstemciye inen JavaScript ölçülüp iş özetine yazılıyor.
      #
      # ⚠️ Eşik aşıldığında koşu BAŞARISIZ OLMAZ, uyarı düşer. Paket boyutu
      # bir kalite kapısı değil, bir trend göstergesi; testleri geçen bir
      # PR'ı birkaç kilobayt yüzünden bloklamak, eşiği yükseltme
      # alışkanlığı doğurur. Amaç sessizce iki katına çıkmasını engellemek.
      #
      # Ölçüm sunucuyu ayağa kaldırıp gerçekten yüklenen sayfayı okuyor;
      # `.next` manifest'lerine bakmıyor. Gerekçe betiğin başında.
      - name: İstemci JS ölçümü
        run: |
          pnpm start &
          sunucu=$!
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          node scripts/paket-olcumu.mjs http://127.0.0.1:3000 / /portfoy /harita
          kill "$sunucu"
        env:
          NEXT_TELEMETRY_DISABLED: '1'
