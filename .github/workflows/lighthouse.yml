name: Lighthouse

# Performansı tahmin etmek yerine ölçer.
#
# Bu iş akışı geliştirme sunucusunda değil CI'da çalışır; sebebi orada
# Chrome'un hazır bulunması ve ölçümün yükten arınmış bir makinede
# yapılabilmesi. 3.2 GB RAM'li kendi sunucumuzda alınan sayılar
# gerçek kullanıcı deneyimini temsil etmez.
#
# ⚠️ Şu an ENGELLEYİCİ DEĞİL, raporlayıcıdır. Sebep: site henüz demo
# veriyle ve gerçek görseller olmadan çalışıyor; bu koşullarda alınan
# skorlar yayına girecek halin skorları değil. Gerçek içerik ve medya
# geldiğinde eşikler zorunlu hale getirilecek (bkz. docs/ILERLEME.md).

# ⚠️ `pull_request` filtresi kaldırıldı: zincirleme PR'larda ölçüm hiç
# koşmuyordu. `push` tetiği bilinçli olarak YOK — ölçüm ~3 dakika sürüyor,
# raporlayıcı olduğu için dal ucunda tekrarı bilgi katmıyor ve tetiklendiği
# yer PR, yani skorun tartışılacağı yer. Dal ucunda ölçüm gerekirse
# `workflow_dispatch` ile elle çalıştırılabilir.
on:
  pull_request:
  workflow_dispatch:

# Aynı PR'a arka arkaya push gelirse eskisini iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  olcum:
    name: Core Web Vitals ölçümü
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: aslihangyd
          POSTGRES_PASSWORD: ci_gecici_sifre
          POSTGRES_DB: aslihangyd_lh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aslihangyd -d aslihangyd_lh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://aslihangyd:ci_gecici_sifre@localhost:5432/aslihangyd_lh
      PAYLOAD_SECRET: ci_gecici_payload_sirri
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate

      # Boş bir siteyi ölçmek anlamsız; demo veri sayfaları doldurur.
      #
      # ⚠️ NODE_ENV BURADA ZORUNLU — ve yalnızca bu adımda.
      #
      # `scripts/seed.ts` kara listeden (`!== 'production'`) beyaz listeye
      # (`=== 'development'`) çevrildi: üretim veritabanına bağlı bir kabukta
      # NODE_ENV tanımsızken `pnpm seed` yazmak siteye [DEMO] kayıt basıyordu.
      # Bu iş akışı o değişiklikle birlikte güncellenmedi; adım "yalnızca
      # NODE_ENV=development ile çalışır" diyerek düştü ve Lighthouse ölçümü
      # aylarca hiç KOŞMADI. Üstteki "raporlayıcıdır" notu doğruydu ama iş
      # kırmızı görünüyordu, çünkü kırılan Lighthouse değil tohumlamaydı.
      #
      # Sonraki adımlara taşınmıyor: `next build` üretim derlemesi olmalı.
      - run: pnpm seed
        env:
          NODE_ENV: development

      - run: pnpm build

      - name: Sunucuyu başlat
        run: |
          pnpm start &
          npx --yes wait-on http://localhost:3000/api/saglik --timeout 60000

      # ⚠️ ÜÇ KOŞUM VE İKİ CİHAZ — ikisi de bilinçli, ikisi de bedeli var.
      #
      # ÜÇ KOŞUM: aynı kod tabanı dört ayrı koşumda anasayfa için 100, 96,
      # 81 ve 77 üretti. Fark koddan değil runner hızından geliyordu; TBT
      # eşiğin kenarında oturuyor ve benchmarkIndex %5 oynayınca skor 20
      # puan sıçrıyor. Tek koşumluk sayıyla "bu PR yavaşlattı" demek, o gün
      # hangi makineye düştüğümüzü tartışmaktan ibaretti.
      #
      # İKİ CİHAZ: trafiğin ~%75'i mobil (CLAUDE.md). Yalnızca masaüstü
      # ölçmek, kullanıcıların dörtte birine bakıp hepsi hakkında konuşmaktı.
      # Mobil preset 4x CPU yavaşlatma ve 4G kısıtı uygular; sayılar
      # masaüstünden belirgin düşük çıkar — düşük olması hata değil, gerçek.
      #
      # Maliyet: 3 sayfa × 2 cihaz × 3 koşum = 18 ölçüm, ~6 dk. `timeout-minutes`
      # 25'te; sayfa eklenirse bu sınır gözden geçirilmeli.
      #
      # Ölçüm başarısız olursa koşu DÜŞMEZ, uyarı düşer — Lighthouse hâlâ
      # raporlayıcı. Ama hiçbir rapor üretilmediyse bir sonraki adım bunu
      # yakalar; sessizce boş özet basmak, ölçüm koşmuyorken yeşil görünmenin
      # ta kendisiydi.
      - name: Lighthouse çalıştır
        run: |
          mkdir -p lighthouse-raporlari
          for cihaz in masaustu mobil; do
            if [ "$cihaz" = "masaustu" ]; then ayar="--preset=desktop"; else ayar=""; fi
            for yol in "" "portfoy" "mahalleler"; do
              ad="${yol:-anasayfa}"
              for kosum in 1 2 3; do
                npx --yes lighthouse "http://localhost:3000/${yol}" \
                  --output=json --output=html \
                  --output-path="lighthouse-raporlari/${cihaz}-${ad}-${kosum}" \
                  --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
                  $ayar \
                  --quiet || echo "::warning::${cihaz}/${ad} koşum ${kosum} ölçülemedi"
              done
            done
          done

      # ⚠️ Hiç rapor üretilmediyse bu adım düşer.
      #
      # Özet betiği boş dizinde "Rapor üretilemedi" yazıp çıkış 0 veriyor;
      # tek başına bırakılırsa ölçüm hiç koşmamışken iş yeşil görünür. Bu
      # projede tam olarak o oldu: tohumlama kırıldığı için Lighthouse'a
      # hiç sıra gelmiyordu ve kırmızı, ölçümün kendisi sanılıyordu.
      - name: Rapor üretildiğini doğrula
        run: |
          adet=$(find lighthouse-raporlari -name '*.report.json' | wc -l)
          echo "Üretilen rapor: $adet"
          if [ "$adet" -eq 0 ]; then
            echo "::error::Hiç Lighthouse raporu üretilmedi — ölçüm koşmadı."
            exit 1
          fi

      - name: Skorları özetle
        if: always()
        run: node scripts/lighthouse-ozet.mjs lighthouse-raporlari >> "$GITHUB_STEP_SUMMARY"

      - name: Raporları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-raporlari
          path: lighthouse-raporlari/
          retention-days: 14
