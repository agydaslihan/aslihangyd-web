name: Üretim imajı

# =============================================================================
# ⚠️ BU İŞ AKIŞI DAĞITIM YAPMAZ. Yalnızca imajı derler ve yayımlar.
#
# Sunucuya `docker compose pull && up -d` komutunu Aslıhan elle çalıştırır.
# Gerekçe: dağıtım tetiklenmesi, veritabanı göçünün ne zaman koşacağına
# insanın karar vermesi gereken tek an. Otomatik dağıtım, geri alınamaz bir
# şema değişikliğini gece yarısı bir merge ile başlatabilirdi.
#
# Adım adım dağıtım komutları: docs/ISLETME-REHBERI.md §5.3
# =============================================================================

# ⚠️ NEDEN VAR: `compose.prod.yml` `ghcr.io/agydaslihan/aslihangyd-web:latest`
# imajını çekiyordu ama o imajı ÜRETEN hiçbir şey yoktu (7 Ağustos 2026'da
# tespit edildi). Yani dağıtım yolu ilk adımında kopuktu.
#
# Dahası, imaj o tarihte HİÇ DERLENEMİYORDU: Dockerfile `public/` dizinini
# kopyalıyor, dizin ise depoda yoktu. Yerelde derlenip düzeltildi; bu iş
# akışı aynı hatanın bir daha sessizce girmesini engelliyor — artık her
# PR'da imaj derleniyor.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KAYIT: ghcr.io
  IMAJ_ADI: ${{ github.repository }}

jobs:
  imaj:
    name: Derle ve yayımla
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Yalnızca paket YAZMA. Depoya yazma yetkisi verilmiyor.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ⚠️ PR'da giriş yapılmaz ve itilmez.
      #
      # PR'lar çatallardan (fork) gelebilir; çatal PR'ına paket yazma yetkisi
      # vermek, depoya erişimi olmayan birine üretim imajını değiştirme
      # imkânı tanırdı. PR'da imaj yalnızca DERLENİR — kırık bir Dockerfile
      # yine de yakalanır, ki bu iş akışının var olma sebebi tam olarak bu.
      - name: GHCR'a giriş
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.KAYIT }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiketleri hazırla
        id: etiket
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.KAYIT }}/${{ env.IMAJ_ADI }}
          # ⚠️ `latest` YANINDA commit SHA'sı da etiketleniyor.
          #
          # `latest` hangi kodun çalıştığını söylemez. Bir sorun çıktığında
          # "hangi commit yayında?" sorusunun cevabı olmalı ve geri dönüş
          # (`docker compose pull` ile eski SHA'ya sabitleyerek) mümkün
          # kalmalı. UYGULAMA_IMAJI değişkeni compose'da tam bunun için var.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Uygulama imajını derle ve yayımla
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: calistirici
          # PR: yalnızca derle. main: yayımla.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.etiket.outputs.tags }}
          labels: ${{ steps.etiket.outputs.labels }}
          # ⚠️ Önbellek GHA'da tutuluyor, imaj kayıtında DEĞİL.
          #
          # `type=registry` önbelleği ara katmanları da kayıta iter. Ara
          # katmanlar `derleyici` aşamasını içerir; oradan sır sızması
          # `.dockerignore` ile engellendi ama yüzeyi hiç açmamak daha
          # sağlam. Ayrıntı: .dockerignore dosyasının başı.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠️ İKİNCİ İMAJ ZORUNLU — göç uygulama imajında çalıştırılamaz.
      #
      # Uygulama imajı Next'in `standalone` çıktısı: içinde ne kaynak kodu,
      # ne `payload` CLI'ı, ne de `src/migrations` var. Bu imaj yalnızca
      # `payload migrate` için; compose'da `gocmen` profili altında duruyor
      # ve `up -d` ile başlamıyor. Gerekçenin tamamı docker/Dockerfile
      # içindeki "3. Göçmen" aşamasında.
      #
      # Tek etiket (`:gocmen`) yeterli: geri dönüş uygulama imajında olur,
      # göç dosyaları ileri doğru birikir ve zaten uygulanmışları atlar.
      - name: Göçmen imajını derle ve yayımla
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: gocmen
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.KAYIT }}/${{ env.IMAJ_ADI }}:gocmen
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Özet
        run: |
          {
            echo "### Üretim imajı"
            echo ""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "PR koşusu — imaj **derlendi ama yayımlanmadı**."
            else
              echo "Yayımlandı:"
              echo ""
              echo '```'
              echo "${{ steps.etiket.outputs.tags }}"
              echo '```'
              echo ""
              echo "⚠️ Bu adım **dağıtım yapmadı.** Sunucuda çalıştırılacak"
              echo "komutlar: \`docs/ISLETME-REHBERI.md\` §5.3."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
