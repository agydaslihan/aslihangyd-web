# =============================================================================
# aslihangyd.com — ÜRETİM
#
# ⚠️ GÜVENLİK: Postgres ve Redis DIŞARIYA HİÇ AÇILMAZ. Geliştirme
# dosyasından farkı budur — orada 127.0.0.1'e bağlıydılar, burada hiç
# `ports` tanımı yok. Servisler birbirine yalnızca Docker ağı üzerinden
# ulaşır. Docker'ın port yayınlaması UFW kurallarını atladığı için
# `ports` eklemek veritabanını internete açmak demektir.
#
# ⚠️ YAYIN PORTU 8443. 80 ve 443 sunucuda başka bir uygulamada.
# Cloudflare 8443'ü proxy'lediği için bu çalışır; TLS Cloudflare origin
# sertifikasıyla sağlanır, Let's Encrypt kullanılmaz.
#
# ⚠️ 8443 tüm arayüzlerde yayınlanır ve Docker UFW'yi atlar — yani origin
# IP'sini bilen biri Cloudflare'i atlayıp doğrudan bağlanabilir.
# Bunu kapatmak için host güvenlik duvarında DOCKER-USER zincirine
# Cloudflare aralıkları dışını reddeden kural gerekir.
# Yordam: docs/ISLETME-REHBERI.md §5.4
#
# Kullanım:
#   docker compose --env-file .env -f docker/compose.prod.yml up -d
# =============================================================================

name: aslihangyd

services:
  uygulama:
    image: ${UYGULAMA_IMAJI:-ghcr.io/agydaslihan/aslihangyd-web:latest}
    container_name: aslihangyd-uygulama
    restart: unless-stopped

    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET tanimli olmali}
      REDIS_URL: redis://redis:6379
      MEDYA_DIZINI: /uygulama/medya
      BAKIM_ANAHTARI: ${BAKIM_ANAHTARI:-}
      # ⚠️ Genel adres artık portu içeriyor. Kanonik URL'ler, site haritası
      # ve OG etiketleri bu değerden üretilir; portsuz bırakılırsa arama
      # motoruna ulaşılamayan adresler bildirilir.
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://aslihangyd.com:8443}
      # ⚠️ ÖN EKSİZ KOPYA — asıl okunan değişken bu.
      #
      # Next.js `NEXT_PUBLIC_*` değişkenlerini DERLEME ANINDA gömer; burada
      # verilen değer sunucu tarafında bile okunmaz. Ön eksiz ad çalışma
      # zamanında okunur, böylece imajı yeniden derlemeden adres
      # değiştirilebilir. Gerekçenin tamamı src/lib/site.ts içinde.
      SITE_ADRESI: ${NEXT_PUBLIC_SERVER_URL:-https://aslihangyd.com:8443}
      NEXT_PUBLIC_WHATSAPP_NUMARA: ${NEXT_PUBLIC_WHATSAPP_NUMARA:-}
      NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
      NEXT_PUBLIC_UMAMI_SITE_ID: ${NEXT_PUBLIC_UMAMI_SITE_ID:-}

    # ⚠️ YALNIZCA GERİ DÖNGÜ (127.0.0.1). Dışarıya açık değil.
    #
    # Bakım cron'u host üzerinde çalışıyor ve /api/bakim'a ulaşması
    # gerekiyor. Caddy üzerinden gitmek işe yaramaz: §5.4'teki güvenlik
    # duvarı kuralı Cloudflare dışındaki kaynakları — sunucunun kendisi
    # dahil — 8443'te reddediyor.
    #
    # 127.0.0.1'e bağlamak güvenli: Docker'ın UFW'yi atlama sorunu
    # 0.0.0.0 yayınları içindir, geri döngü arayüzü dışarıdan erişilemez.
    # Ayrıca `curl localhost:3000/api/saglik` ile sunucudan doğrudan
    # sağlık kontrolü yapılabiliyor.
    ports:
      - '127.0.0.1:3000:3000'

    volumes:
      - medya:/uygulama/medya

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    mem_limit: 1200m

    networks: [ic]

  caddy:
    image: caddy:2-alpine
    container_name: aslihangyd-caddy
    restart: unless-stopped

    # Dışarıya açılan TEK servis budur.
    #
    # ⚠️ 80 ve 443 YAYINLANMIYOR — o portlar sunucuda başka bir uygulamada.
    # QUIC/HTTP3 (443/udp) de kaldırıldı: Cloudflare origin'e HTTP/2 ile
    # bağlanıyor, 8443 üzerinde UDP dinlemenin karşılığı yok.
    ports:
      - '8443:8443'

    # ⚠️ CADDY_EPOSTA kaldırıldı: yalnızca Let's Encrypt bildirimleri
    # içindi ve ACME tamamen kapalı.

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ⚠️ Cloudflare origin sertifikası. Salt okunur bağlanır; anahtar
      # dosyası kabın içinde değiştirilemez. `docker/certs/` .gitignore'da.
      - ./certs:/etc/caddy/certs:ro
      - caddy_veri:/data
      - caddy_yapilandirma:/config

    depends_on: [uygulama]

    mem_limit: 128m

    networks: [ic]

  # ⚠️ GÖÇMEN — `up -d` ile BAŞLAMAZ, elle çağrılır.
  #
  # Üretim imajı Next'in `standalone` çıktısı; içinde ne kaynak kodu ne de
  # `payload` CLI'ı var, yani şema göçü orada çalıştırılamaz. Bu servis
  # aynı depodan derlenen ayrı bir imajı (`:gocmen`) kullanıyor.
  #
  # ⚠️ `profiles` bilinçli: profil verilmeden hiçbir compose komutu bu
  # servisi başlatmaz. Göçün NE ZAMAN koşacağına insan karar vermeli —
  # kap her yeniden başladığında şema değiştiren bir kurulum, geri
  # alınamaz bir değişikliği gece yarısı bir yeniden başlatmayla
  # tetikleyebilirdi.
  #
  # Kullanım (docs/ISLETME-REHBERI.md §5.3):
  #   docker compose --env-file .env -f docker/compose.prod.yml \
  #     --profile gocmen run --rm gocmen pnpm payload migrate:status
  #   docker compose --env-file .env -f docker/compose.prod.yml \
  #     --profile gocmen run --rm gocmen
  gocmen:
    image: ${GOCMEN_IMAJI:-ghcr.io/agydaslihan/aslihangyd-web:gocmen}
    profiles: [gocmen]

    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET tanimli olmali}

    depends_on:
      postgres:
        condition: service_healthy

    # Göç kısa sürer ama şema değişikliği bellek isteyebilir; uygulamayla
    # aynı sınıfta tutuluyor.
    mem_limit: 700m

    networks: [ic]

  postgres:
    image: postgis/postgis:17-3.5
    container_name: aslihangyd-postgres
    restart: unless-stopped

    # ⚠️ `ports` YOK ve eklenmeyecek. Yukarıdaki güvenlik notunu okuyun.
    # (Geliştirme dosyasında 127.0.0.1'e bağlıdır; üretimde hiç
    #  yayınlanmaz — daha sıkı olan bu.)

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?tanimli olmali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?tanimli olmali}
      POSTGRES_DB: ${POSTGRES_DB:?tanimli olmali}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'

    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    mem_limit: 700m

    networks: [ic]

  redis:
    image: redis:7-alpine
    container_name: aslihangyd-redis
    restart: unless-stopped

    # ⚠️ `ports` YOK. Postgres ile aynı gerekçe.

    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

    mem_limit: 128m

    networks: [ic]

networks:
  ic:
    driver: bridge

volumes:
  pgdata:
    name: aslihangyd-pgdata
  medya:
    name: aslihangyd-medya
  caddy_veri:
    name: aslihangyd-caddy-veri
  caddy_yapilandirma:
    name: aslihangyd-caddy-yapilandirma
