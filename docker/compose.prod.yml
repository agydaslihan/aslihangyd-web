# =============================================================================
# aslihangyd.com — ÜRETİM
#
# ⚠️ GÜVENLİK: Postgres ve Redis DIŞARIYA HİÇ AÇILMAZ. Geliştirme
# dosyasından farkı budur — orada 127.0.0.1'e bağlıydılar, burada hiç
# `ports` tanımı yok. Servisler birbirine yalnızca Docker ağı üzerinden
# ulaşır. Docker'ın port yayınlaması UFW kurallarını atladığı için
# `ports` eklemek veritabanını internete açmak demektir.
#
# ⚠️ YAYIN PORTLARI 80 ve 443 — standart. Bu makineye özel bir dış IP
# tahsis edildi ve portlar boş. TLS'i Caddy Let's Encrypt ile kendisi alır.
# (Önceki 8443 + Cloudflare origin sertifikası kurgusu, portlar dolu olduğu
# için zorunluluktu; artık gereksiz.)
#
# ⚠️ 80 portu KAPATILAMAZ. Yalnızca HTTP→HTTPS yönlendirmesi için değil,
# Let's Encrypt'in HTTP-01 doğrulaması için de gerekiyor. Kapatılırsa ilk
# sertifika alınamaz ve mevcut sertifika yenilenemez.
#
# ⚠️ 80/443 tüm arayüzlerde yayınlanır ve Docker UFW'yi atlar — yani origin
# IP'sini bilen biri Cloudflare'i atlayıp doğrudan bağlanabilir.
# Bunu kapatmak için host güvenlik duvarında DOCKER-USER zincirine
# Cloudflare aralıkları dışını reddeden kural gerekir.
# ⚠️ Kuralı yazarken 80'i Let's Encrypt'e AÇIK bırakmak gerekiyor;
# yordam ve gerekçe: docs/ISLETME-REHBERI.md §5.4
#
# Kullanım:
#   docker compose --env-file .env -f docker/compose.prod.yml up -d
# =============================================================================

name: aslihangyd

services:
  uygulama:
    image: ${UYGULAMA_IMAJI:-ghcr.io/agydaslihan/aslihangyd-web:latest}
    container_name: aslihangyd-uygulama
    restart: unless-stopped

    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET tanimli olmali}
      REDIS_URL: redis://redis:6379
      MEDYA_DIZINI: /uygulama/medya
      BAKIM_ANAHTARI: ${BAKIM_ANAHTARI:-}

      # ── Çalışma zamanı yapılandırması ───────────────────────────────────
      #
      # ⚠️ BURADAKİ ADLARIN HİÇBİRİ `NEXT_PUBLIC_` ÖNEKLİ DEĞİL, BİLİNÇLİ.
      #
      # Next.js `NEXT_PUBLIC_*` değişkenlerini DERLEME ANINDA pakete gömer —
      # sunucu tarafında bile. Üretim imajı GitHub Actions'ta derleniyor ve
      # orada bu değişkenlerin hiçbiri tanımlı değil, `Dockerfile`da da
      # `ARG` yok. Yani önekli bir ad buraya yazılırsa HİÇBİR ETKİSİ OLMAZ:
      # imaj hangi değerle derlendiyse (boş dizeyle) o kalır.
      #
      # 12 Ağustos 2026'ya kadar bu dosyada tam olarak öyle üç satır vardı
      # (`NEXT_PUBLIC_WHATSAPP_NUMARA`, `NEXT_PUBLIC_UMAMI_*`). Çalışıyor
      # görünüyor, çalışmıyorlardı. Aynı sebeple yayında harita açılmıyor,
      # Turnstile bot koruması kapalı kalıyor, analitik hiç yüklenmiyor ve
      # drone videoları "yapılandırılmadı" diyordu.
      #
      # Ön eksiz adlar çalışma zamanında okunur: değeri `.env` içinde
      # değiştirip `up -d` demek yeter, imajı yeniden derlemek gerekmez.
      # Gerekçenin tamamı: src/lib/harita/sunucu.ts
      #
      # ⚠️ Buraya yeni bir `NEXT_PUBLIC_` satırı EKLEMEYİN. `pnpm test`
      # içindeki ortam kapısı kodda böyle bir okuma kalmadığını denetliyor.

      # ── Geriye dönük uyum ────────────────────────────────────────────
      #
      # ⚠️ ESKİ `NEXT_PUBLIC_*` ADLARI DA GEÇİRİLİYOR VE BU BİLİNÇLİ.
      #
      # 12 Ağustos'ta değişkenler ön eksiz adlara taşındı. Kod doğruydu ama
      # SUNUCUDAKİ `.env` eski adlarda kaldı ve yeni adlar boş geldi:
      # harita açılmadı, iletişim bilgileri kayboldu ve en kötüsü Turnstile
      # SİTE anahtarı boş kalıp formları bot korumasız bıraktı. Gizli anahtar
      # doluydu, yani hata "yarı yapılandırılmış" göründüğü için sessizdi.
      #
      # Uygulama artık yeni adı bulamazsa eskisine düşüyor (`lib/ayarlar.ts`)
      # — ama bu ancak eski ad KABA ULAŞIRSA çalışır. Aşağıdaki satırlar
      # tam olarak onun için.
      #
      # ⚠️ Bunlar geçici. `.env` yeni adlara taşındığında kaldırılabilir;
      # panel bildirimi hangi ayarın hâlâ eski adla okunduğunu söylüyor.
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-}
      NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_ANAHTARI: ${NEXT_PUBLIC_TURNSTILE_SITE_ANAHTARI:-}
      NEXT_PUBLIC_WHATSAPP_NUMARA: ${NEXT_PUBLIC_WHATSAPP_NUMARA:-}
      NEXT_PUBLIC_ILETISIM_TELEFON: ${NEXT_PUBLIC_ILETISIM_TELEFON:-}
      NEXT_PUBLIC_ILETISIM_EPOSTA: ${NEXT_PUBLIC_ILETISIM_EPOSTA:-}
      NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
      NEXT_PUBLIC_UMAMI_SITE_ID: ${NEXT_PUBLIC_UMAMI_SITE_ID:-}
      NEXT_PUBLIC_BUNNY_STREAM_LIBRARY_ID: ${NEXT_PUBLIC_BUNNY_STREAM_LIBRARY_ID:-}
      NEXT_PUBLIC_BUNNY_STREAM_CDN_HOSTNAME: ${NEXT_PUBLIC_BUNNY_STREAM_CDN_HOSTNAME:-}

      # ── Asıl adlar ───────────────────────────────────────────────────

      # Kanonik URL'ler, site haritası ve OG etiketleri bu değerden üretilir.
      #
      # ⚠️ PORT YAZMAYIN. Caddy 80/443 yayınlıyor; `:8443` eski kurgudan
      # kalma ve kanonik adreslere sızarsa arama motoruna ULAŞILAMAYAN
      # adresler bildirir. Panel bu durumu bildirim olarak gösteriyor.
      SITE_ADRESI: ${SITE_ADRESI:-${NEXT_PUBLIC_SERVER_URL:-https://aslihangyd.com}}

      # Harita. Boşsa /harita boş durum gösterir (kırık gri kutu değil).
      MAPTILER_ANAHTARI: ${MAPTILER_ANAHTARI:-}

      # Bot koruması. İkisi de doluysa etkin; biri boşsa katman devre dışı.
      TURNSTILE_SITE_ANAHTARI: ${TURNSTILE_SITE_ANAHTARI:-}
      TURNSTILE_GIZLI_ANAHTAR: ${TURNSTILE_GIZLI_ANAHTAR:-}

      # Analitik. ⚠️ Dolu olması betiğin yükleneceği anlamına GELMEZ;
      # yükleme çerez onayına bağlı (CLAUDE.md kural 8).
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_SITE_ID: ${UMAMI_SITE_ID:-}

      # Video CDN. Boşsa video bölümü "oynatıcı yapılandırılmadı" der.
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_CDN_HOSTNAME: ${BUNNY_STREAM_CDN_HOSTNAME:-}

      # İletişim yedekleri — asıl kaynak CMS → Kurumsal Bilgiler.
      WHATSAPP_NUMARA: ${WHATSAPP_NUMARA:-}
      ILETISIM_TELEFON: ${ILETISIM_TELEFON:-}
      ILETISIM_EPOSTA: ${ILETISIM_EPOSTA:-}

      # OpenStreetMap POI içe aktarma sunucusu.
      #
      # ⚠️ Boş bırakmak GÜVENLİ: kod herkese açık `overpass-api.de`ye düşer.
      # Değişken yalnızca ayna sunucu kullanmak içindir — genel sunucu yoğun
      # saatlerde yavaşlıyor ve içe aktarma zaman aşımına uğrayabiliyor.
      OVERPASS_ADRESI: ${OVERPASS_ADRESI:-}

      # Google Places — OpenStreetMap'in zayıf kaldığı yeri tamamlayan
      # opsiyonel katman.
      #
      # ⚠️ Boş bırakmak GÜVENLİ ve varsayılan: anahtar yoksa katman sessizce
      # kapalı kalır ve site OSM verisiyle aynen çalışır. Anahtar tek başına
      # da yetmez — Site Bölümleri → "Google Places katmanı" da açık olmalı.
      #
      # ⚠️ ÜCRETLİ. Her arama ve her çalışma saati gösterimi bir çağrıdır;
      # aylık sayı panelde (Ayarlar → Google Places Kullanımı) görünür.
      #
      # ⚠️ LİSANS: Google içeriği veritabanına YAZILMAZ. Saklanan tek şey yer
      # kimliği; ad, adres ve çalışma saati gösterildiği anda çekilir.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}

      # Google Search Console — panelin "arama kelimeleri" bölümü.
      #
      # ⚠️ Boşken bölüm SAYI UYDURMAZ: "yapılandırılmadı" yazar ve neyin
      # eksik olduğunu söyler. Sıfırlarla dolu bir tablo "arama trafiği yok"
      # gibi okunurdu; doğru cevap "bakamıyoruz".
      #
      # ⚠️ Servis hesabı anahtarı salt okunur kapsamla üretilmeli
      # (`webmasters.readonly`); bu anahtar hiçbir şeyi değiştirememeli.
      ARAMA_KONSOLU_SITE: ${ARAMA_KONSOLU_SITE:-}
      ARAMA_KONSOLU_SERVIS_HESABI: ${ARAMA_KONSOLU_SERVIS_HESABI:-}

      # ⚠️ ANTHROPIC_API_KEY VE ANTHROPIC_ARAMA_MODELI BİLİNÇLİ OLARAK YOK.
      #
      # AI doğal dil arama, avukat metinleri gelene kadar ERTELENDİ: ziyaretçi
      # sorgusu yurt dışına aktarılıyor ve aydınlatma metnine bu aktarımın
      # eklenmesi gerekiyor (KVKK). Özellik SiteSections anahtarıyla zaten
      # kapalı; anahtarı kaba hiç sokmamak ikinci kapı.
      #
      # Açılacağı zaman: önce aydınlatma metni, sonra bu iki satır.

    # ⚠️ YALNIZCA GERİ DÖNGÜ (127.0.0.1). Dışarıya açık değil.
    #
    # Bakım cron'u host üzerinde çalışıyor ve /api/bakim'a ulaşması
    # gerekiyor. Caddy üzerinden gitmek işe yaramaz: §5.4'teki güvenlik
    # duvarı kuralı Cloudflare dışındaki kaynakları — sunucunun kendisi
    # dahil — 443'te reddediyor.
    #
    # 127.0.0.1'e bağlamak güvenli: Docker'ın UFW'yi atlama sorunu
    # 0.0.0.0 yayınları içindir, geri döngü arayüzü dışarıdan erişilemez.
    # Ayrıca `curl localhost:3000/api/saglik` ile sunucudan doğrudan
    # sağlık kontrolü yapılabiliyor.
    ports:
      - '127.0.0.1:3000:3000'

    volumes:
      - medya:/uygulama/medya

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    mem_limit: 1200m

    networks: [ic]

  caddy:
    image: caddy:2-alpine
    container_name: aslihangyd-caddy
    restart: unless-stopped

    # Dışarıya açılan TEK servis budur.
    #
    # ⚠️ 80 hem HTTP→HTTPS yönlendirmesi hem de Let's Encrypt'in HTTP-01
    # doğrulaması için gerekli; kapatılırsa sertifika alınamaz ve
    # yenilenemez.
    #
    # QUIC/HTTP3 (443/udp) bilinçli olarak yayınlanmıyor: Cloudflare
    # origin'e HTTP/2 ile bağlanıyor, UDP dinlemenin karşılığı yok.
    ports:
      - '80:80'
      - '443:443'

    environment:
      # ⚠️ Let's Encrypt bildirim adresi. Boş bırakılırsa Caddy anonim ACME
      # hesabı açar ve yenileme bozulduğunda kimse haberdar olmaz.
      CADDY_EPOSTA: ${CADDY_EPOSTA:?CADDY_EPOSTA tanimli olmali}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ⚠️ `caddy_veri` KALICI OLMALI — sertifikalar burada duruyor.
      # Silinirse Caddy yeniden sertifika ister ve Let's Encrypt'in haftalık
      # oran sınırına (aynı alan adı için 5/hafta) takılma riski doğar.
      - caddy_veri:/data
      - caddy_yapilandirma:/config

    depends_on: [uygulama]

    mem_limit: 128m

    networks: [ic]

  # ⚠️ GÖÇMEN — `up -d` ile BAŞLAMAZ, elle çağrılır.
  #
  # Üretim imajı Next'in `standalone` çıktısı; içinde ne kaynak kodu ne de
  # `payload` CLI'ı var, yani şema göçü orada çalıştırılamaz. Bu servis
  # aynı depodan derlenen ayrı bir imajı (`:gocmen`) kullanıyor.
  #
  # ⚠️ `profiles` bilinçli: profil verilmeden hiçbir compose komutu bu
  # servisi başlatmaz. Göçün NE ZAMAN koşacağına insan karar vermeli —
  # kap her yeniden başladığında şema değiştiren bir kurulum, geri
  # alınamaz bir değişikliği gece yarısı bir yeniden başlatmayla
  # tetikleyebilirdi.
  #
  # Kullanım (docs/ISLETME-REHBERI.md §5.3):
  #   docker compose --env-file .env -f docker/compose.prod.yml \
  #     --profile gocmen run --rm gocmen pnpm payload migrate:status
  #   docker compose --env-file .env -f docker/compose.prod.yml \
  #     --profile gocmen run --rm gocmen
  gocmen:
    image: ${GOCMEN_IMAJI:-ghcr.io/agydaslihan/aslihangyd-web:gocmen}
    profiles: [gocmen]

    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET tanimli olmali}

    depends_on:
      postgres:
        condition: service_healthy

    # Göç kısa sürer ama şema değişikliği bellek isteyebilir; uygulamayla
    # aynı sınıfta tutuluyor.
    mem_limit: 700m

    networks: [ic]

  postgres:
    image: postgis/postgis:17-3.5
    container_name: aslihangyd-postgres
    restart: unless-stopped

    # ⚠️ `ports` YOK ve eklenmeyecek. Yukarıdaki güvenlik notunu okuyun.
    # (Geliştirme dosyasında 127.0.0.1'e bağlıdır; üretimde hiç
    #  yayınlanmaz — daha sıkı olan bu.)

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?tanimli olmali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?tanimli olmali}
      POSTGRES_DB: ${POSTGRES_DB:?tanimli olmali}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'

    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    mem_limit: 700m

    networks: [ic]

  redis:
    image: redis:7-alpine
    container_name: aslihangyd-redis
    restart: unless-stopped

    # ⚠️ `ports` YOK. Postgres ile aynı gerekçe.

    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

    mem_limit: 128m

    networks: [ic]

networks:
  ic:
    driver: bridge

volumes:
  pgdata:
    name: aslihangyd-pgdata
  medya:
    name: aslihangyd-medya
  caddy_veri:
    name: aslihangyd-caddy-veri
  caddy_yapilandirma:
    name: aslihangyd-caddy-yapilandirma
